<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camperos Games</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>


<body>
    <header id="inicio">
        <h1>Camperos Games</h1>
        <p>Encuentra lo que buscas en videojuegos para todas las plataformas.</p>
    </header>

    <nav class="navbar navbar-expand-md navbar-dark menu-principal">
        <div class="container">
            <a class="navbar-brand" href="#inicio">Camperos Games</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion"
                aria-controls="menuNavegacion" aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#inicio">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#productos" data-categoria="accion">
                            Acción
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#productos" data-categoria="deportes">
                            Deportes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section id="productos">
            <h2>Productos destacados</h2>

            <form id="formularioBusqueda" class="d-flex mb-4" role="search">
                <label for="campoBusqueda" class="visually-hidden">
                    Buscar videojuego
                </label>

                <input id="campoBusqueda" class="form-control me-2" type="search" placeholder="Buscar videojuego">

                <button class="btn btn-warning" type="submit">
                    Buscar
                </button>
            </form>

            <div id="catalogoProductos" class="row g-4"></div>
        </section>
    </main>

    <button type="button" id="botonCarrito" class="btn btn-danger carrito-flotante" data-bs-toggle="offcanvas"
        data-bs-target="#panelCarrito" aria-controls="panelCarrito" aria-label="Abrir carrito de compras">
        🛒
        <span id="cantidadCarrito" class="badge rounded-pill text-bg-light">
            0
        </span>
    </button>

    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="panelCarrito" aria-labelledby="tituloCarrito">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title" id="tituloCarrito">
                Carrito de compras
            </h2>

            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Cerrar"></button>
        </div>

        <div class="offcanvas-body">
            <ul id="listaCarrito" class="list-group mb-3"></ul>

            <p class="fw-bold fs-5">
                Total:
                <span id="totalCarrito">$0</span>
            </p>
        </div>
    </div>
    <footer id="contacto">
        <p>Dirección: Avenida Vicuña Mackenna Oriente 6100, La Florida, Chile.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
